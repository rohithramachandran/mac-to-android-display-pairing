plugins {
    id 'com.android.application'
}

android {
    namespace 'com.macdisplay.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.macdisplay.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // No extra dependencies needed, using standard Android APIs
}
